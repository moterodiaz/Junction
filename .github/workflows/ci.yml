name: ci

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: craci
    steps:
      - uses: actions/checkout@v4
      # The CRACI image lacks Swift's runtime libraries (libncurses.so.6), so the toolchain cannot start without them.
      - name: Swift runtime libraries
        run: |
          SUDO=""; [ "$(id -u)" -ne 0 ] && SUDO=sudo
          $SUDO apt-get update -qq
          $SUDO apt-get install -y -qq --no-install-recommends libncurses6 libedit2 libxml2 libcurl4 libsqlite3-0 zlib1g-dev build-essential
      - name: Swift toolchain
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - name: Shell syntax
        run: |
          for f in tools/* .claude/hooks/*.sh; do
            [ -f "$f" ] || continue
            if head -n1 "$f" | grep -q bash; then bash -n "$f"; fi
          done
      - name: Guard hook tests
        run: |
          if [ -x ".claude/hooks/bash-guard.test.sh" ]; then
            .claude/hooks/bash-guard.test.sh
          fi
      - name: Queue and pause policy tests
        run: |
          tools/tests/task.test.sh
          tools/tests/pause_automation.test.sh
      - name: Areas have tests
        run: |
          for d in ios backend contracts; do
            [ -d "$d" ] || continue
            code_files="$(git ls-files "$d" | grep -vE "^${d}/(test\.sh|README[^/]*|\.gitkeep)$" | head -1)"
            if [ -n "$code_files" ]; then
              if [ ! -x "$d/test.sh" ]; then
                echo "::error::$d has code but no executable test.sh"
                exit 1
              fi
            fi
          done
      # ponytail: placeholder areas; each area drops in an executable test.sh, add real jobs when ios/backend/contracts need more.
      - name: Area tests
        run: |
          for d in ios backend contracts; do
            if [ -x "$d/test.sh" ]; then (cd "$d" && ./test.sh); fi
          done
      - name: Trust gate tests
        run: |
          tools/metrics --selftest
          tools/tests/trust_gate.test.sh
