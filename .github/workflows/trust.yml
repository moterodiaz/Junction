name: trust

# DISABLED (2026-11-14): removed from the required checks and the workflow disabled because of GitHub API
# rate limits, not because the gate fails or cannot work. Evaluating PRs exhausted the Actions installation
# quota, so runs failed closed and blocked merges. The gate logic (tools/metrics --gate,
# tools/tests/trust_gate.test.sh) is unchanged and correct. To re-enable: `gh workflow enable trust.yml`,
# then add `trust` back to the main-protect ruleset required checks, once quota use is understood.
#
# Posts the commit status `trust` on each open PR's head (REQ-PROC-02, #186). It fails while the PR touches an
# area with an open `escape` issue and neither that area's owner nor the lead has approved the head commit
# (tools/metrics --gate). NOT currently required in the main-protect ruleset (see DISABLED note above); it holds auto-merge, claude-fix's included.
# The job is not named `trust`: a job's own check run would carry that name and pass even when the status fails.
# Single serial group: at most one run writes `trust` at a time, preventing a stale success from overwriting a
# failure. pull_request events also cover open PRs with no trust status yet so a dropped queued run cannot
# leave a new commit blocked up to an hour (fail-closed: a head with no status is blocked until evaluated).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]
  # Opening, closing or editing an escape changes trust for every open PR in its area.
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to evaluate (empty = every open PR)
        required: false

jobs:
  evaluate:
    # Fork PRs get a read-only token and cannot post a status; issue events matter only for escapes.
    if: >-
      (github.event_name != 'pull_request' && github.event_name != 'pull_request_review' && github.event_name != 'issues') ||
      (github.event_name == 'issues' && (contains(github.event.issue.labels.*.name, 'escape') || github.event.label.name == 'escape')) ||
      github.event.pull_request.head.repo.full_name == github.repository
    # Job-level concurrency so skipped runs never occupy a queue slot. Single group: at most one run
    # writes `trust` at a time; a newer event queues behind the running one, never concurrently.
    concurrency:
      group: trust-status
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      issues: read
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      METRICS_REPO: ${{ github.repository }}
      EVENT_PR: ${{ github.event.pull_request.number || inputs.pr_number }}
      EVENT_NAME: ${{ github.event_name }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      # The default branch, not the PR head: the script runs with a write token.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Post trust status
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            # Always evaluate the event PR. Also include any open PR whose head sha has no trust status yet:
            # if this run was queued and GitHub dropped an earlier queued run for that PR, the new head stays
            # blocked/fail-closed until the next hourly cron unless we pick it up here.
            prs="${EVENT_PR}"
            while IFS=$'\t' read -r other sha_other; do
              [ "$other" = "${EVENT_PR}" ] && continue
              trust_count="$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha_other/status" \
                --jq '[.statuses[] | select(.context=="trust")] | length')"
              [ "$trust_count" = "0" ] && prs="$prs $other"
            done < <(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" \
              --jq '.[] | [.number,.head.sha] | @tsv')
          elif [ "${EVENT_NAME}" = "workflow_dispatch" ] && [ -n "${EVENT_PR:-}" ]; then
            # Explicit pr_number: just that PR.
            prs="${EVENT_PR}"
          else
            # pull_request_review / issues / schedule / workflow_dispatch without pr_number: sweep all open PRs.
            # Paginated: a capped list would leave older PRs with a stale status.
            prs="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" --jq '.[].number')"
          fi
          for pr in $prs; do
            [[ "$pr" =~ ^[0-9]+$ ]] || { echo "::error::bad PR number: $pr"; exit 1; }
            sha="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq .head.sha)"
            code=0; out="$(tools/metrics --gate "$pr" 2>&1)" || code=$?
            if [ "$code" -ne 0 ] && [ "$code" -ne 3 ]; then
              for _r in 1 2; do
                sleep 20
                code=0; out="$(tools/metrics --gate "$pr" 2>&1)" || code=$?
                [ "$code" -eq 0 ] || [ "$code" -eq 3 ] && break
              done
            fi
            case "$code" in
              0) state=success ;;
              3) state=failure ;;
              *) state=error; out="could not evaluate, so held: $(tail -n1 <<<"$out")" ;;  # fails closed
            esac
            gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$sha" -f state="$state" -f context=trust \
              -f description="${out:0:140}" -f target_url="$RUN_URL" >/dev/null
            echo "#$pr ($sha): $state: $out"
          done
