name: PR Sweeper

# Un-sticks the PR pipeline: nudges missing reviews, and pings the PR author on the
# board for conflicts or failing CI. Also announces merges so dependents pull main.

on:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [main]
  workflow_run:
    workflows: ["Claude Fix Bot Reviews"]
    types: [completed]
  workflow_dispatch:
    inputs:
      chain:
        type: number
        default: 0
  pull_request:
    types: [closed]

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: write

env:
  GH_TOKEN: ${{ github.token }}
  REPO: ${{ github.repository }}

jobs:
  sweep:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: pr-sweeper
      cancel-in-progress: false
    steps:
      - name: Sweep open PRs
        shell: bash
        run: |
          set -euo pipefail
          board() { gh api "repos/$REPO/issues/1/comments" -f body="[Junction's sweeper] $1" >/dev/null; }
          # Dedup window: board posts from the last day.
          since="$(date -u -d '1 day ago' +%Y-%m-%dT%H:%M:%SZ)"
          recent="$(gh api --paginate "repos/$REPO/issues/1/comments?since=$since" --jq '.[].body')"
          seen() { grep -qF -- "$1" <<<"$recent"; }

          gh pr list -R "$REPO" --state open --limit 200 \
            --json number,author,isDraft,createdAt,mergeStateStatus,reviews,comments,statusCheckRollup \
            --jq '.[] | select(.isDraft | not) | @base64' |
          while read -r row; do
            j="$(base64 -d <<<"$row")"
            n="$(jq -r .number <<<"$j")"
            a="$(jq -r .author.login <<<"$j")"

            # 1. No Greptile review after 20 min: nudge it once.
            reviewed="$(jq '[(.reviews[].author.login), (.comments[].author.login)] | any(test("greptile"))' <<<"$j")"
            old="$(jq '(now - (.createdAt | fromdateiso8601)) > 1200' <<<"$j")"
            if [ "$reviewed" = false ] && [ "$old" = true ] \
               && ! jq -e '.comments[].body | select(test("@greptileai review"))' <<<"$j" >/dev/null; then
              gh pr comment "$n" -R "$REPO" --body "@greptileai review"
            fi

            # 2. Conflicts with main: auto-merge is blocked until the author resolves them.
            mss="$(jq -r .mergeStateStatus <<<"$j")"
            if [ "$mss" = UNKNOWN ]; then
              sleep 15
              mss="$(gh pr view "$n" -R "$REPO" --json mergeStateStatus --jq .mergeStateStatus 2>/dev/null)" || mss=UNKNOWN
            fi
            if [ "$mss" = DIRTY ] && ! seen "PR #$n conflicts"; then
              board "@$a PR #$n conflicts with main. Run git pull --no-rebase, merge origin/main (no rebase, no force-push), then push."
            fi

            # 3. Failing CI: bots only react to reviews, so nothing else will notice.
            if jq -e 'any(.statusCheckRollup[]?; .conclusion | IN("FAILURE","TIMED_OUT","CANCELLED"))' <<<"$j" >/dev/null && ! seen "PR #$n CI failing"; then
              board "@$a PR #$n CI failing. Fix on the PR branch and push; auto-merge resumes when checks pass."
            fi
          done

      - name: Clean in-progress labels and check task queue
        shell: bash
        run: |
          set -euo pipefail
          board() { gh api "repos/$REPO/issues/1/comments" -f body="[Junction's sweeper] $1" >/dev/null; }
          since="$(date -u -d '1 day ago' +%Y-%m-%dT%H:%M:%SZ)"
          recent="$(gh api --paginate "repos/$REPO/issues/1/comments?since=$since" --jq '.[].body')"
          seen() { grep -qF -- "$1" <<<"$recent"; }

          closed="$(gh issue list -R "$REPO" --state closed --label in-progress --json number --jq '.[].number')"
          while read -r n; do
            [ -z "$n" ] && continue
            gh issue edit "$n" -R "$REPO" --remove-label in-progress || true
          done <<<"$closed"

          count=0
          tasks="$(gh issue list -R "$REPO" --label task --state open \
            --search 'no:assignee -label:blocked -label:in-progress' \
            --limit 100 --json number,body \
            --jq '.[] | [.number, (.body | @base64)] | @tsv')"
          while IFS=$'\t' read -r _ b64body; do
            [ -z "$b64body" ] && continue
            body="$(base64 --decode <<<"$b64body")"
            deps="$(awk '/^## Depends on[[:space:]]*$/{f=1;next} f&&/^## /{exit} f{while(match($0, /#[0-9]+/)){print substr($0,RSTART+1,RLENGTH-1);$0=substr($0,RSTART+RLENGTH)}}' <<<"$body")"
            ready=true
            while read -r d; do
              [ -z "$d" ] && continue
              state="$(gh issue view "$d" -R "$REPO" --json state --jq .state 2>/dev/null)" || state=""
              [ "$state" != "CLOSED" ] && ready=false && break
            done <<<"$deps"
            [ "$ready" = "true" ] && (( ++count )) || true
          done <<<"$tasks"
          if [[ "$count" =~ ^[0-9]+$ ]] && (( count < 3 )) && ! seen "task queue low"; then
            board "task queue low ($count ready). Run tools/task fill and file tasks from Junction-Prep/metalab_prd.md."
          fi

      - name: Retry stuck claude-fix
        shell: bash
        run: |
          set -euo pipefail
          board() { gh api "repos/$REPO/issues/1/comments" -f body="[Junction's sweeper] $1" >/dev/null; }

          now_epoch="$(date -u +%s)"
          prs="$(gh pr list -R "$REPO" --state open \
            --json number,isDraft,author,headRefName,updatedAt,commits --limit 100)"

          jq -c '.[] | select(.isDraft | not)' <<<"$prs" | while IFS= read -r row; do
            n="$(jq -r .number <<<"$row")"
            author="$(jq -r .author.login <<<"$row")"

            # (a) count unresolved review threads
            # shellcheck disable=SC2016
            count="$(gh api graphql --paginate \
              -f query='query($o:String!,$r:String!,$n:Int!,$endCursor:String){repository(owner:$o,name:$r){pullRequest(number:$n){reviewThreads(first:100,after:$endCursor){pageInfo{hasNextPage endCursor} nodes{isResolved}}}}}' \
              -f o="${REPO%/*}" -f r="${REPO#*/}" -F n="$n" \
              --jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved | not)] | length' \
              | awk '{s+=$1} END {print s+0}')" || continue
            [ "$count" -gt 0 ] || continue

            # (b) skip if already has a giveup comment
            pr_comments="$(gh pr view "$n" --repo "$REPO" --json comments \
              --jq '[.comments[].body] | join("\n")')" || continue
            # Any handoff (loop cap, held ci, failed run, gave up) means a human already owns it.
            grep -qF "needs human:" <<<"$pr_comments" && continue

            # (c) last activity check (20 min threshold)
            last_activity="$(jq -r '(.commits[-1].committedDate // .updatedAt)' <<<"$row")"
            # --paginate runs --jq once per page, so slurp all pages and pick one latest timestamp.
            latest_bot="$(gh api --paginate "repos/$REPO/issues/$n/comments" \
              | jq -rs '[.[][] | select(.user.login == "claude[bot]" or .user.login == "github-actions[bot]") | .created_at] | max // empty')" || continue
            latest_review="$(gh api --paginate "repos/$REPO/pulls/$n/comments" \
              | jq -rs '[.[][] | select(.user.login == "claude[bot]" or .user.login == "github-actions[bot]") | .created_at] | max // empty')" || continue
            for ts in "$latest_bot" "$latest_review"; do
              [ -z "$ts" ] && continue
              [[ "$ts" > "$last_activity" ]] && last_activity="$ts"
            done
            [ -z "$last_activity" ] && continue
            activity_epoch="$(date -u -d "$last_activity" +%s)" || continue
            age=$(( now_epoch - activity_epoch ))
            [ "$age" -lt 1200 ] && continue

            # A queued or running fix may not have left a timestamp yet; don't spend a retry on it.
            # ponytail: repo-wide check (runs don't expose their PR); per-PR matching if this over-skips
            active="$(for s in queued in_progress; do
              gh run list -R "$REPO" --workflow claude-fix.yml --status "$s" --json databaseId --jq length
            done | awk '{t+=$1} END {print t+0}')" || continue
            [ "$active" -gt 0 ] && continue

            # (d) retry or give up
            retries="$(gh pr view "$n" --repo "$REPO" --json comments \
              --jq '[.comments[].body | select(contains("[sweeper] claude-fix retry"))] | length')" || continue

            if [ "$retries" -lt 2 ]; then
              gh workflow run claude-fix.yml -R "$REPO" -f pr_number="$n" || continue
              gh pr comment "$n" --repo "$REPO" \
                --body "[sweeper] claude-fix retry $((retries+1))/2: $count unresolved thread(s), no activity for 20+ minutes" || continue
            else
              gh pr comment "$n" --repo "$REPO" \
                --body "@$author needs human: sweeper gave up: $count thread(s) still open after 2 claude-fix retries" || continue
              board "@$author PR #$n needs human: sweeper gave up: $count thread(s) still open after 2 claude-fix retries" || true
            fi
          done

  heartbeat:
    needs: sweep
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # One chain: a new run cancels the sleeping one, so chains never stack. sweep stays in its own group.
    concurrency:
      group: pr-sweeper-heartbeat
      cancel-in-progress: true
    steps:
      - name: Heartbeat
        env:
          chain: ${{ inputs.chain || 0 }}
        shell: bash
        run: |
          dirty="$(gh pr list -R "$REPO" --state open --limit 200 --json number,mergeStateStatus,isDraft \
            --jq '[.[] | select(.isDraft | not) | select(.mergeStateStatus != "CLEAN")] | length' 2>/dev/null)" || dirty=0
          if [ "${dirty:-0}" -gt 0 ] && [ "${chain:-0}" -lt 36 ]; then
            sleep 600
            gh workflow run pr-sweeper.yml -R "$REPO" -f chain="$((chain+1))" || true
          fi

  merged:
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    env:
      TITLE: ${{ github.event.pull_request.title }}
      AUTHOR: ${{ github.event.pull_request.user.login }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - name: Announce merge on board
        run: |
          gh api "repos/$REPO/issues/1/comments" \
            -f body="[Junction's sweeper] PR #$PR merged: $TITLE (by @$AUTHOR). Everyone: git pull origin main before your next push." >/dev/null
